<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080f1e">
<title>WebTools BD - Smart Dashboard</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#080f1e;
--panel:#111c30;
--panel2:#192740;
--border:#293954;
--text:#f1f5ff;
--muted:#91a2bd;
--blue:#3478ff;
--purple:#802de5;
}

body{
background:var(--bg);
color:var(--text);
font-family:Arial,sans-serif;
min-height:100vh;
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
display:flex;
min-height:100vh;
}

.sidebar{
width:245px;
flex-shrink:0;
background:#0d1729;
border-right:1px solid var(--border);
padding:24px 16px;
}

.brand{
font-size:22px;
font-weight:bold;
color:#59baff;
margin-bottom:7px;
}

.sub{
font-size:12px;
color:var(--muted);
margin-bottom:30px;
}

.nav{
display:grid;
gap:7px;
}

.nav button{
width:100%;
border:0;
border-radius:10px;
padding:13px;
text-align:left;
background:transparent;
color:#b2bfd5;
}

.nav button.active,
.nav button:hover,
.addbtn{
background:linear-gradient(110deg,#2869f0,#802de5);
color:white;
}

.main{
flex:1;
min-width:0;
max-width:1500px;
padding:28px;
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
margin-bottom:24px;
}

.top h1{font-size:25px}

.search{
width:min(380px,100%);
padding:14px 16px;
border:1px solid var(--border);
border-radius:12px;
background:var(--panel);
color:white;
outline:none;
}

.search:focus{border-color:var(--blue)}

.hero{
background:linear-gradient(115deg,#123d87,#51218f);
padding:28px;
border:1px solid #354a8c;
border-radius:18px;
margin-bottom:24px;
}

.hero h2{
font-size:24px;
margin-bottom:10px;
}

.hero p{
color:#d6e2ff;
line-height:1.6;
}

.section-title{
font-size:17px;
margin:22px 0 14px;
}

.categories{
display:flex;
flex-wrap:wrap;
gap:9px;
margin-bottom:22px;
}

.categories button{
padding:10px 16px;
border-radius:30px;
border:1px solid var(--border);
background:var(--panel);
color:var(--muted);
}

.categories button.active{
background:var(--blue);
border-color:var(--blue);
color:white;
}

.grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:16px;
}

.card{
background:var(--panel);
border:1px solid var(--border);
border-radius:16px;
padding:20px;
text-align:center;
min-width:0;
transition:.2s;
}

.card:hover{
transform:translateY(-4px);
border-color:#557eff;
}

.logo{
font-size:38px;
margin:8px 0 14px;
}

.card h3{
font-size:16px;
margin-bottom:7px;
overflow-wrap:anywhere;
}

.card p{
font-size:12px;
color:var(--muted);
margin-bottom:17px;
}

.actions{
display:flex;
gap:8px;
}

.visit{
flex:1;
display:block;
padding:12px 6px;
border-radius:9px;
background:linear-gradient(100deg,#2869f0,#802de5);
color:white;
text-decoration:none;
font-size:13px;
font-weight:bold;
}

.smallbtn{
padding:10px 13px;
border:1px solid var(--border);
border-radius:9px;
background:var(--panel2);
color:white;
}

.fav{color:#ffd34f}

.empty{
grid-column:1/-1;
padding:50px 15px;
text-align:center;
color:var(--muted);
}

.footer{
text-align:center;
color:#73839e;
font-size:12px;
margin:35px 0 10px;
}

.modal{
display:none;
position:fixed;
inset:0;
z-index:20;
background:#000b;
padding:16px;
align-items:center;
justify-content:center;
}

.modal.show{display:flex}

.modalbox{
background:var(--panel);
border:1px solid var(--border);
width:100%;
max-width:440px;
max-height:90vh;
overflow-y:auto;
border-radius:18px;
padding:23px;
}

.modalbox h2{margin-bottom:20px}

.modalbox label{
display:block;
font-size:13px;
color:var(--muted);
margin:13px 0 7px;
}

.modalbox input,.modalbox select{
width:100%;
padding:13px;
border:1px solid var(--border);
border-radius:10px;
background:#091326;
color:white;
}

.modalactions{
display:flex;
gap:10px;
margin-top:20px;
}

.modalactions button{
flex:1;
padding:13px 8px;
border:0;
border-radius:9px;
}

.save{
background:linear-gradient(100deg,#2869f0,#802de5);
color:white;
}

.cancel{
background:var(--panel2);
color:white;
}

.settings-card{
background:var(--panel);
border:1px solid var(--border);
border-radius:14px;
padding:22px;
}

.settings-card p{
color:var(--muted);
margin:15px 0;
line-height:1.6;
}

/* TABLET */

@media(max-width:950px){
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.main{padding:18px}
.sidebar{width:190px}
}

/* MOBILE: SIDEBAR ALWAYS LEFT */

@media(max-width:600px){

.app{
display:flex;
align-items:stretch;
min-height:100vh;
}

.sidebar{
position:sticky;
top:0;
height:100vh;
overflow-y:auto;
width:145px;
flex-shrink:0;
padding:15px 9px;
border-right:1px solid var(--border);
border-bottom:0;
}

.brand{
font-size:16px;
line-height:1.4;
margin-bottom:5px;
}

.sub{
font-size:9px;
line-height:1.4;
margin-bottom:20px;
}

.nav{
display:grid;
gap:7px;
}

.nav button{
width:100%;
padding:10px 7px;
font-size:11px;
border-radius:8px;
text-align:left;
}

.main{
flex:1;
min-width:0;
width:calc(100% - 145px);
padding:13px 10px;
margin:0;
}

.top{
display:flex;
flex-direction:column;
align-items:stretch;
gap:11px;
margin-bottom:16px;
}

.top h1{font-size:20px}

.search{
width:100%;
padding:11px 8px;
font-size:12px;
}

.hero{
padding:15px 12px;
margin-bottom:16px;
border-radius:13px;
}

.hero h2{
font-size:17px;
line-height:1.4;
margin-bottom:8px;
}

.hero p{
font-size:11px;
line-height:1.5;
}

.section-title{
font-size:14px;
margin:15px 0 10px;
}

.categories{
gap:6px;
margin-bottom:15px;
}

.categories button{
padding:8px 9px;
font-size:10px;
}

.grid{
grid-template-columns:1fr;
gap:10px;
}

.card{
padding:13px 8px;
border-radius:12px;
}

.logo{
font-size:30px;
margin:5px 0 9px;
}

.card h3{font-size:14px}

.card p{
font-size:10px;
margin-bottom:10px;
}

.actions{gap:5px}

.visit{
padding:10px 3px;
font-size:10px;
}

.smallbtn{
padding:8px 9px;
font-size:12px;
}

.footer{
font-size:9px;
margin:20px 0;
}
}

/* VERY SMALL MOBILE */

@media(max-width:360px){
.sidebar{width:125px;padding:12px 7px}
.main{width:calc(100% - 125px);padding:10px 7px}
.brand{font-size:14px}
.nav button{font-size:10px;padding:9px 5px}
.hero h2{font-size:15px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="brand">🌐 WebTools BD</div>
<div class="sub">Smart Links, Smart Life</div>

<nav class="nav">
<button class="active" data-page="home">⌂ Home</button>
<button data-page="websites">▣ Websites</button>
<button data-page="categories">☷ Categories</button>
<button data-page="favorites">★ Favorites</button>
<button class="addbtn" id="addBtn">＋ Add Website</button>
<button data-page="settings">⚙ Settings</button>
</nav>

</aside>

<main class="main">

<div class="top">
<h1 id="pageTitle">Dashboard</h1>
<input class="search" id="search"
placeholder="🔍 Search websites...">
</div>

<section class="hero">
<h2>Find & Visit Your Favorite Sites</h2>
<p>All your useful websites in one place. Fast, simple and free.</p>
</section>

<h3 class="section-title" id="sectionTitle">Explore Websites</h3>

<div class="categories" id="categories"></div>

<section class="grid" id="websites"></section>

<div class="footer">
© 2026 WebTools BD · All Rights Reserved
</div>

</main>
</div>

<!-- ADD WEBSITE MODAL -->

<div class="modal" id="modal">
<div class="modalbox">

<h2>＋ Add New Website</h2>

<form id="siteForm">

<label>Website Name</label>
<input id="siteName" placeholder="e.g. Canva" required>

<label>Website URL</label>
<input id="siteUrl" placeholder="https://example.com" required>

<label>Category</label>
<select id="siteCategory">
<option>Tools</option>
<option>Social</option>
<option>Education</option>
<option>Entertainment</option>
<option>Other</option>
</select>

<label>Emoji Icon</label>
<input id="siteIcon" value="🌐" maxlength="8">

<div class="modalactions">
<button type="button" class="cancel" id="cancelBtn">Cancel</button>
<button type="submit" class="save">Save Website</button>
</div>

</form>
</div>
</div>

<script>

const defaultSites=[
{name:"Google",url:"https://google.com",cat:"Tools",icon:"🔎",desc:"Search Engine"},
{name:"YouTube",url:"https://youtube.com",cat:"Entertainment",icon:"▶️",desc:"Videos"},
{name:"Facebook",url:"https://facebook.com",cat:"Social",icon:"📘",desc:"Social Media"},
{name:"Instagram",url:"https://instagram.com",cat:"Social",icon:"📸",desc:"Photo & Social"},
{name:"ChatGPT",url:"https://chatgpt.com",cat:"Tools",icon:"🤖",desc:"AI Assistant"},
{name:"Telegram",url:"https://telegram.org",cat:"Social",icon:"✈️",desc:"Messaging"},
{name:"Canva",url:"https://canva.com",cat:"Tools",icon:"🎨",desc:"Design Tool"},
{name:"Wikipedia",url:"https://wikipedia.org",cat:"Education",icon:"📚",desc:"Online Knowledge"},
{name:"Spotify",url:"https://spotify.com",cat:"Entertainment",icon:"🎵",desc:"Music"}
];

function load(key,fallback){
try{
const value=JSON.parse(localStorage.getItem(key));
return value===null?fallback:value;
}catch(e){
return fallback;
}
}

let sites=load("webtools_sites",defaultSites);
let favorites=load("webtools_favs",[]);
let currentCategory="All";
let page="home";

const $=id=>document.getElementById(id);

function persist(){
try{
localStorage.setItem("webtools_sites",JSON.stringify(sites));
localStorage.setItem("webtools_favs",JSON.stringify(favorites));
}catch(e){
alert("Unable to save data in this browser.");
}
}

function safeURL(value){
try{
const u=new URL(value);
return ["http:","https:"].includes(u.protocol)?u.href:null;
}catch(e){
return null;
}
}

function makeButton(text,callback,className=""){
const b=document.createElement("button");
b.textContent=text;
b.className=className;
b.addEventListener("click",callback);
return b;
}

function renderCategories(){

const box=$("categories");
box.replaceChildren();

const cats=["All","Social","Tools","Education","Entertainment","Other"];

cats.forEach(cat=>{
const b=makeButton(cat,()=>{
currentCategory=cat;
render();
},currentCategory===cat?"active":"");

box.appendChild(b);
});

box.style.display=page==="settings"?"none":"flex";
}

function showPage(newPage){

page=newPage;
currentCategory="All";

const titles={
home:"Dashboard",
websites:"All Websites",
categories:"Categories",
favorites:"My Favorites",
settings:"Settings"
};

$("pageTitle").textContent=titles[page]||"Dashboard";

$("sectionTitle").textContent=
page==="favorites"?"Favorite Websites":
page==="categories"?"Browse Categories":
"Explore Websites";

document.querySelectorAll(".nav [data-page]").forEach(btn=>{
btn.classList.toggle("active",btn.dataset.page===page);
});

render();
}

function render(){

renderCategories();

const q=$("search").value.trim().toLowerCase();

const container=$("websites");
container.replaceChildren();

if(page==="settings"){

const box=document.createElement("div");
box.className="settings-card";

const title=document.createElement("h3");
title.textContent="⚙ Dashboard Settings";

const info=document.createElement("p");
info.textContent="Your custom websites and favorites are saved in this browser.";

const reset=makeButton(
"Reset Website List",
resetSites,
"smallbtn"
);

box.append(title,info,reset);
container.appendChild(box);
return;
}

let list=sites.filter(s=>{

const categoryMatch=
currentCategory==="All"||s.cat===currentCategory;

const favoriteMatch=
page!=="favorites"||favorites.includes(s.url);

const searchMatch=
(s.name+" "+s.cat+" "+(s.desc||""))
.toLowerCase().includes(q);

return categoryMatch&&favoriteMatch&&searchMatch;
});

container.replaceChildren();

if(!list.length){

const empty=document.createElement("div");
empty.className="empty";
empty.textContent="No websites found 😕";
container.appendChild(empty);
return;
}

list.forEach(site=>{

const card=document.createElement("article");
card.className="card";

const logo=document.createElement("div");
logo.className="logo";
logo.textContent=site.icon||"🌐";

const name=document.createElement("h3");
name.textContent=site.name;

const desc=document.createElement("p");
desc.textContent=site.desc||site.cat;

const actions=document.createElement("div");
actions.className="actions";

const url=safeURL(site.url);

const visit=document.createElement("a");
visit.className="visit";
visit.textContent="Visit ↗";
visit.href=url||"#";
visit.target="_blank";
visit.rel="noopener noreferrer";

if(!url){
visit.addEventListener("click",e=>e.preventDefault());
}

const fav=makeButton(
favorites.includes(site.url)?"★":"☆",
()=>{
if(favorites.includes(site.url)){
favorites=favorites.filter(x=>x!==site.url);
}else{
favorites.push(site.url);
}
persist();
render();
},
"smallbtn "+(favorites.includes(site.url)?"fav":"")
);

actions.append(visit,fav);

if(site.custom){

const del=makeButton("✕",()=>{

if(confirm("Delete this website?")){

sites=sites.filter(s=>s.url!==site.url);
favorites=favorites.filter(x=>x!==site.url);

persist();
render();

}

},"smallbtn");

actions.appendChild(del);
}

card.append(logo,name,desc,actions);
container.appendChild(card);

});

}

function openModal(){
$("modal").classList.add("show");
}

function closeModal(){
$("modal").classList.remove("show");
}

function resetSites(){

if(confirm("Reset all websites and favorites?")){

sites=defaultSites.map(s=>({...s}));
favorites=[];

persist();
render();

}

}

// NAVIGATION

document.querySelectorAll(".nav [data-page]").forEach(btn=>{
btn.addEventListener("click",()=>{
showPage(btn.dataset.page);
});
});

// BUTTONS

$("addBtn").addEventListener("click",openModal);
$("cancelBtn").addEventListener("click",closeModal);
$("search").addEventListener("input",render);

// MODAL

$("modal").addEventListener("click",e=>{
if(e.target===$("modal")){
closeModal();
}
});

// ADD WEBSITE

$("siteForm").addEventListener("submit",e=>{

e.preventDefault();

const name=$("siteName").value.trim();
let url=$("siteUrl").value.trim();

if(!/^https?:\/\//i.test(url)){
url="https://"+url;
}

if(!name||!safeURL(url)){
alert("Please enter a valid website name and URL.");
return;
}

if(sites.some(s=>s.url===url)){
alert("This website already exists.");
return;
}

sites.push({
name,
url,
cat:$("siteCategory").value,
icon:$("siteIcon").value.trim()||"🌐",
desc:"Added by you",
custom:true
});

persist();

e.target.reset();
$("siteIcon").value="🌐";
$("search").value="";

closeModal();
showPage("websites");

});

// INITIALIZE

render();

</script>

</body>
</html>
