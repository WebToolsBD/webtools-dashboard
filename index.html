<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebTools BD</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070e1c;--panel:#111b2e;--panel2:#17233a;--border:#26344e;--text:#eef4ff;--muted:#91a1bd;--blue:#3478ff;--purple:#792bdf}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:225px;background:#0c1426;border-right:1px solid var(--border);padding:22px 15px;z-index:5}
.brand{font-size:20px;font-weight:bold;color:#55b7ff;margin-bottom:5px}
.sub{font-size:11px;color:var(--muted);margin-bottom:25px}
.nav button{width:100%;text-align:left;border:0;background:transparent;color:#aab9d2;padding:12px;border-radius:9px;margin:3px 0;cursor:pointer}
.nav button.active,.nav button:hover{background:linear-gradient(100deg,#2563eb,#792bdf);color:white}
.main{margin-left:225px;padding:25px;max-width:1500px}
.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}
.top h1{font-size:23px}
.search{width: min(360px,100%);padding:12px 14px;border:1px solid var(--border);background:var(--panel);border-radius:11px;color:white;outline:none}
.hero{padding:23px;border-radius:17px;background:linear-gradient(110deg,#103c85,#46218c);margin-bottom:20px}
.hero h2{font-size:21px;margin-bottom:8px}
.hero p{color:#d5e2ff;font-size:14px}
.categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.categories button{background:var(--panel);color:var(--muted);border:1px solid var(--border);padding:9px 14px;border-radius:22px;cursor:pointer}
.categories button.active{background:#2866e9;color:white;border-color:#2866e9}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:17px;text-align:center;transition:.2s;min-width:0}
.card:hover{transform:translateY(-3px);border-color:#5578ff}
.logo{font-size:35px;margin:8px 0 12px}
.card h3{font-size:15px;margin-bottom:5px;word-break:break-word}
.card p{font-size:11px;color:var(--muted);margin-bottom:14px}
.actions{display:flex;gap:8px}
.visit{display:block;flex:1;background:linear-gradient(100deg,#2869ee,#8429df);color:white;text-decoration:none;border:0;padding:10px;border-radius:9px;font-weight:bold;font-size:12px}
.smallbtn{border:1px solid var(--border);background:var(--panel2);color:white;padding:9px;border-radius:8px;cursor:pointer}
.fav{color:#ffd34f}
.empty{text-align:center;padding:45px;color:var(--muted);grid-column:1/-1}
.footer{text-align:center;color:#687995;font-size:11px;margin:30px 0}
.addbtn{background:linear-gradient(100deg,#2469ee,#7b2ddd)!important;color:white!important}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.modalbox{background:#111b2e;border:1px solid var(--border);width:100%;max-width:430px;border-radius:16px;padding:22px}
.modalbox h2{margin-bottom:18px}
.modalbox label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}
.modalbox input,.modalbox select{width:100%;padding:12px;background:#0a1325;color:white;border:1px solid var(--border);border-radius:9px}
.modalactions{display:flex;gap:10px;margin-top:18px}
.modalactions button{flex:1;padding:12px;border-radius:9px;border:0;cursor:pointer}
.save{background:linear-gradient(100deg,#2563eb,#7b2ddd);color:white}
.cancel{background:#26344e;color:white}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){
.sidebar{
position:static;
width:100%;
padding:14px;
border-right:0;
border-bottom:1px solid var(--border);
}
.brand{font-size:19px}
.sub{font-size:11px;margin-bottom:12px}
.nav{
display:flex;
flex-wrap:wrap;
gap:6px;
}
.nav button{
width:auto;
margin:0;
padding:9px 11px;
font-size:12px;
}
.main{
margin-left:0;
padding:14px;
max-width:none;
}
.top{display:block}
.top h1{
font-size:21px;
margin-bottom:12px;
}
.search{width:100%}
.hero{padding:18px}
.hero h2{font-size:18px}
.hero p{font-size:12px}
.grid{
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}
.card{padding:12px}
.logo{font-size:28px}
.card h3{font-size:14px}
.card p{font-size:11px}
.actions{gap:6px}
.visit{padding:9px 5px;font-size:11px}
.smallbtn{padding:8px}
.categories button{
padding:8px 10px;
font-size:11px;
}
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">🌐 WebTools BD</div>
  <div class="sub">Smart Links, Smart Life</div>
  <nav class="nav">
    <button class="active" onclick="showPage('home',this)">⌂ Home</button>
    <button onclick="showPage('websites',this)">▣ Websites</button>
    <button onclick="showPage('categories',this)">☷ Categories</button>
    <button onclick="showPage('favorites',this)">★ Favorites</button>
    <button onclick="openModal()" class="addbtn">＋ Add Website</button>
    <button onclick="showPage('settings',this)">⚙ Settings</button>
  </nav>
</aside>

<main class="main">
  <div class="top">
    <h1 id="pageTitle">Dashboard</h1>
    <input class="search" id="search" placeholder="🔍 Search websites..." oninput="render()">
  </div>

  <section class="hero">
    <h2>Find & Visit Your Favorite Sites</h2>
    <p>All your useful websites in one place. Fast, simple and free.</p>
  </section>

  <div class="categories" id="categories"></div>
  <section class="grid" id="websites"></section>
  <div class="footer">© 2026 WebTools BD · All Rights Reserved</div>
</main>

<div class="modal" id="modal">
  <div class="modalbox">
    <h2>＋ Add New Website</h2>
    <form id="siteForm">
      <label>Website Name</label>
      <input id="siteName" placeholder="e.g. Canva" required>
      <label>Website URL</label>
      <input id="siteUrl" placeholder="https://example.com" required>
      <label>Category</label>
      <select id="siteCategory">
        <option>Tools</option>
        <option>Social</option>
        <option>Education</option>
        <option>Entertainment</option>
        <option>Other</option>
      </select>
      <label>Emoji Icon</label>
      <input id="siteIcon" value="🌐" maxlength="8">
      <div class="modalactions">
        <button type="button" class="cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="save">Save Website</button>
      </div>
    </form>
  </div>
</div>

<script>
const defaultSites=[
{name:"Google",url:"https://google.com",cat:"Tools",icon:"🔎",desc:"Search Engine"},
{name:"YouTube",url:"https://youtube.com",cat:"Entertainment",icon:"▶️",desc:"Videos"},
{name:"Facebook",url:"https://facebook.com",cat:"Social",icon:"📘",desc:"Social Media"},
{name:"Instagram",url:"https://instagram.com",cat:"Social",icon:"📸",desc:"Photo & Social"},
{name:"ChatGPT",url:"https://chatgpt.com",cat:"Tools",icon:"🤖",desc:"AI Assistant"},
{name:"Telegram",url:"https://telegram.org",cat:"Social",icon:"✈️",desc:"Messaging"},
{name:"Canva",url:"https://canva.com",cat:"Tools",icon:"🎨",desc:"Design Tool"},
{name:"Wikipedia",url:"https://wikipedia.org",cat:"Education",icon:"📚",desc:"Online Knowledge"},
{name:"Spotify",url:"https://spotify.com",cat:"Entertainment",icon:"🎵",desc:"Music"}
];
let sites=JSON.parse(localStorage.getItem("webtools_sites")||"null")||defaultSites;
let favorites=JSON.parse(localStorage.getItem("webtools_favs")||"[]");
let currentCategory="All",page="home";
function persist(){localStorage.setItem("webtools_sites",JSON.stringify(sites));localStorage.setItem("webtools_favs",JSON.stringify(favorites))}
function showPage(p,btn){
 page=p;currentCategory="All";
 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
 if(btn)btn.classList.add("active");
 document.getElementById("pageTitle").textContent=({home:"Dashboard",websites:"All Websites",categories:"Categories",favorites:"Favorites",settings:"Settings"})[p]||"Dashboard";
 render();
}
function renderCategories(){
 let cats=["All","Social","Tools","Education","Entertainment","Other"];
 let box=document.getElementById("categories");
 box.innerHTML=cats.map(c=>`<button class="${currentCategory===c?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}
function setCat(c){currentCategory=c;render()}
function render(){
 renderCategories();
 let q=document.getElementById("search").value.toLowerCase();
 let list=sites.filter(s=>(page!=="favorites"||favorites.includes(s.url))&&(currentCategory==="All"||s.cat===currentCategory)&&(s.name.toLowerCase().includes(q)||s.cat.toLowerCase().includes(q)));
 if(page==="categories"){
 list=sites.filter(s=>s.cat===currentCategory||currentCategory==="All");
 }
 if(page==="settings"){
 document.getElementById("websites").innerHTML=`<div class="card" style="grid-column:1/-1;text-align:left"><h3>⚙ Settings</h3><p style="margin:15px 0">Your custom websites and favorites are saved in this browser.</p><button class="smallbtn" onclick="resetSites()">Reset website list</button></div>`;
 return;
 }
 document.getElementById("websites").innerHTML=list.length?list.map(s=>`
 <div class="card">
 <div class="logo">${s.icon||"🌐"}</div>
 <h3>${escapeHTML(s.name)}</h3>
 <p>${escapeHTML(s.desc||s.cat)}</p>
 <div class="actions">
 <a class="visit" href="${safeURL(s.url)}" target="_blank" rel="noopener">Visit ↗</a>
 <button class="smallbtn ${favorites.includes(s.url)?"fav":""}" onclick="toggleFav('${encodeURIComponent(s.url)}')" title="Favorite">★</button>
 ${s.custom?`<button class="smallbtn" onclick="deleteSite('${encodeURIComponent(s.url)}')" title="Delete">✕</button>`:""}
 </div>
 </div>`).join(""):`<div class="empty">No websites found 😕</div>`;
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function safeURL(u){try{let x=new URL(u);return ["http:","https:"].includes(x.protocol)?x.href:"#"}catch{return "#"}}
function toggleFav(encoded){let url=decodeURIComponent(encoded);favorites.includes(url)?favorites=favorites.filter(x=>x!==url):favorites.push(url);persist();render()}
function deleteSite(encoded){let url=decodeURIComponent(encoded);if(confirm("Delete this website?")){sites=sites.filter(s=>s.url!==url);favorites=favorites.filter(f=>f!==url);persist();render()}}
function openModal(){document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("siteForm").addEventListener("submit",e=>{
 e.preventDefault();
 let name=document.getElementById("siteName").value.trim();
 let url=document.getElementById("siteUrl").value.trim();
 if(!/^https?:\/\//i.test(url))url="https://"+url;
 if(!safeURL(url)||safeURL(url)==="#"){alert("Please enter a valid website URL");return}
 sites.push({name,url,cat:document.getElementById("siteCategory").value,icon:document.getElementById("siteIcon").value||"🌐",desc:"Added by you",custom:true});
 persist();e.target.reset();document.getElementById("siteIcon").value="🌐";closeModal();showPage("websites");document.getElementById("search").value="";
});
function resetSites(){if(confirm("Reset all websites and favorites?")){sites=defaultSites;favorites=[];persist();render()}}
render();
</script>
</body>
</html>
